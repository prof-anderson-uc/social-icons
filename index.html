<!DOCTYPE html>
<html lang="en">
<head>
   <meta charset="UTF-8">
   <meta name="viewport" content="width=device-width, initial-scale=1.0">
   <title>Animated Social Media Icons</title>
   <!-- Reset Stylesheet -->
   <link rel="stylesheet" href="reset.css">

   <!-- Adds Font Awesome v4.7 CDN -->
   <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/4.7.0/css/font-awesome.min.css">

   <!-- Link to the custom CSS -->
   <link rel="stylesheet" href="social.css">
</head>
<body>
   <h1>Animated Social Media Icons:</h1>

   
   <!-- Replace # with your actual social media profile links -->
   <section class="social-btns">

      <a class="btn youtube" href="#">
         <i class="fa fa-youtube"></i>
      </a>

      <a class="btn instagram" href="#">
         <i class="fa fa-instagram"></i>
      </a>

      <a class="btn facebook" href="#">
         <i class="fa fa-facebook"></i>
      </a>

      <a class="btn twitter" href="#">
         <i class="fa fa-twitter"></i>
      </a>

      <a class="btn linkedin" href="#">
         <i class="fa fa-linkedin"></i>
      </a>

      <a class="btn soundcloud" href="#">
         <i class="fa fa-soundcloud"></i>
      </a>

      <a class="btn spotify" href="#">
         <i class="fa fa-spotify"></i>
      </a>

      <a class="btn twitch" href="#">
         <i class="fa fa-twitch"></i>
      </a>

   </section>

</body>
</html>
